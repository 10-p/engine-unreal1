name: build

# Builds the Linux, Windows, web and Android targets on every push and pull request and uploads the binaries
# as workflow artifacts; a push to main also replaces the rolling "latest" release (the `latest` job).
#
# It does not run the game: a hosted runner has no GPU. It checks that every target builds, that the Linux
# build is one engine binary, that the Windows exe imports only system DLLs and that the APK packages every ABI.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (32-bit, one static binary)
    runs-on: ubuntu-24.04
    # A container, not the bare runner: the runner image's preinstalled amd64 -dev packages make
    # `libsdl2-dev:i386` uninstallable (its libglib2.0-dev-bin is Multi-Arch: foreign), and a stock
    # ubuntu:24.04 resolves the i386 packages normally.
    container: ubuntu:24.04
    # A container job runs steps with `sh` (dash), which has no `set -o pipefail`; use bash.
    defaults:
      run:
        shell: bash
    steps:
      # The image has no git, and checkout needs it.
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake make g++ pkg-config

      - uses: actions/checkout@v4

      # The engine is a 32-bit build (-m32), so every dev package it links has to be the :i386 one.
      - name: Install the 32-bit toolchain
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libsdl2-dev:i386 libopenal-dev:i386

      # FetchContent clones into the build directory, so that is what is cached, keyed on the files that
      # decide what is fetched.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-native/_deps
          key: deps-native-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset native
        working-directory: Source

      - name: Build
        run: cmake --build --preset native -j$(nproc)
        working-directory: Source

      - name: Check it really is one binary
        run: |
          test -x build-native/Unreal/Unreal.bin
          # BUILD_STATIC: no engine package .so beside the executable. System libraries (SDL2, libGL, libc)
          # and the bundled libopenal.so.1 stay dynamic.
          if ls build-native/*/*.so >/dev/null 2>&1; then
            echo "::error::engine .so modules were produced — BUILD_STATIC is not in effect"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: unreal1-linux
          # The binary loads the bundled libopenal.so.1 from its own directory ($ORIGIN): ship them together.
          path: |
            build-native/Unreal/Unreal.bin
            build-native/Unreal/libopenal.so.1
          if-no-files-found: error
          # A short retention keeps the artifacts under the storage quota (a full quota fails the upload);
          # the newest build of main stays downloadable from the `latest` release.
          retention-days: 7

  windows:
    name: windows (MinGW-w64 cross, one self-contained .exe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-windows/_deps
          key: deps-windows-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset windows
        working-directory: Source

      - name: Build
        run: cmake --build --preset windows -j$(nproc)
        working-directory: Source

      # Without -static-libgcc/-static-libstdc++ the exe would import libgcc_s_dw2-1.dll and libstdc++-6.dll
      # and run only where the toolchain is installed; nothing else in the build would fail.
      - name: Assert the exe imports nothing but system DLLs
        run: |
          set -euo pipefail
          imports=$(i686-w64-mingw32-objdump -p build-windows/Unreal/Unreal.exe \
                    | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          # OpenAL32.dll is expected: OpenAL Soft is the one library the Windows build ships as a DLL
          # (Source/cmake/OpenALMingw.cmake), and the build copies it next to the exe.
          bad=$(echo "$imports" | grep -viE '^(ADVAPI32|GDI32|IMM32|KERNEL32|msvcrt|ole32|OLEAUT32|OPENGL32|OpenAL32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|WS2_32)\.dll$' || true)
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports: $bad"; exit 1; fi
          test -f build-windows/Unreal/OpenAL32.dll

      - uses: actions/upload-artifact@v4
        with:
          name: unreal1-windows
          path: |
            build-windows/Unreal/Unreal.exe
            build-windows/Unreal/OpenAL32.dll
          if-no-files-found: error
          # A short retention keeps the artifacts under the storage quota (a full quota fails the upload);
          # the newest build of main stays downloadable from the `latest` release.
          retention-days: 7

  web:
    name: web (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # emsdk is set up before the configure step: emcc is probed at configure time, and the preset's
      # toolchain file is found through $EMSDK.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      # A fresh emsdk has an empty ports cache, and the SDL2 port's headers reach the sysroot only once the
      # port is built; without this the first compile fails with "'SDL2/SDL.h' file not found".
      - name: Build the SDL2 port into the emsdk sysroot
        run: embuilder build sdl2

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps
          key: deps-wasm-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      # No game assets are needed: the web link preloads only Engine/Config/web/Default.ini, and the host
      # serves the game files at run time.
      - name: Configure
        run: cmake --preset wasm
        working-directory: Source

      - name: Build
        run: cmake --build --preset wasm -j$(nproc)
        working-directory: Source

      # meta.json's gitSha must be the commit that was built.
      - name: Check artifact provenance
        run: |
          set -euo pipefail
          sha=$(python3 -c "import json;print(json.load(open('build-wasm/SDLLaunch/meta.json'))['provenance']['gitSha'])")
          echo "meta.json gitSha=$sha  HEAD=$GITHUB_SHA"
          case "$GITHUB_SHA" in "$sha"*) ;; *) echo "::error::meta.json gitSha does not match HEAD"; exit 1;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: unreal1-web
          path: build-wasm/SDLLaunch/
          if-no-files-found: error
          # A short retention keeps the artifacts under the storage quota (a full quota fails the upload);
          # the newest build of main stays downloadable from the `latest` release.
          retention-days: 7

  android:
    name: android (arm64 + x86_64 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17: the Gradle daemon's (Android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only platform-tools: the action's default list names `tools`, which the current SDK repository does not
      # have. The NDK and CMake come from the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The NDK and the CMake the Gradle plugin asks for; the NDK version matches app/build.gradle's ndkVersion,
      # because AGP silently downloads its own on a mismatch. CI writes its own local.properties for this
      # runner's SDK.
      - name: Install the NDK + CMake and point the build at this runner's SDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;4.1.2" >/dev/null
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" "$ANDROID_HOME" > Android/local.properties

      - name: Build the APK
        run: ./gradlew assembleDebug --console=plain
        working-directory: Android

      # Both ABIs must be in there: a silent drop to one still installs and fails only on the device not tested.
      - name: Assert every ABI is packaged
        run: |
          set -euo pipefail
          apk=Android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libUnreal.so" || { echo "::error::missing $abi"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: unreal1-android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # A short retention keeps the artifacts under the storage quota (a full quota fails the upload);
          # the newest build of main stays downloadable from the `latest` release.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The rolling "latest" release: the newest build of main as release assets, which do not expire
  # (artifacts expire by age alone, so a repository without pushes would have nothing left to download).
  #
  # Delete-then-create: `gh release edit --target` does not move a published release's tag, and a new
  # release carries only the assets this run produced.
  #
  # `permissions: contents: write` is required: the repository's default workflow token is read-only.
  latest:
    name: rolling "latest" release
    needs: [linux, windows, web, android]
    if: github.event_name == 'push' && (github.ref_name == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Every artifact this run produced, each in its own directory named after it.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack one zip per build
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          n=0
          for d in artifacts/*/; do
            name=$(basename "$d")
            ( cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" . )
            n=$((n + 1))
          done
          # An empty release would look like a good build with missing downloads: fail instead.
          [ "$n" -gt 0 ] || { echo "::error::no artifacts were downloaded — nothing to publish"; exit 1; }
          echo "packed $n build(s):"
          ls -la out/

      - name: Publish (replacing the previous one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling tag per branch: `latest` for the default branch, `latest-<branch>` otherwise.
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            tag="latest"
          else
            tag="latest-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          fi
          echo "tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$tag — $(git log -1 --format=%s | cut -c1-72)" \
            --notes "$(printf '%s\n' \
              "The newest Unreal 1 engine build of \`$GITHUB_REF_NAME\`, rebuilt and replaced on every push." \
              "" \
              "Commit: \`$GITHUB_SHA\`" \
              "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "These assets do not expire. The per-push artifacts on the run page do, after 7 days.")"
